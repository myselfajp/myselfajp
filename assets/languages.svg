<svg xmlns="http://www.w3.org/2000/svg" width="600" height="270" viewBox="0 0 600 270" role="img" aria-label="Ali Parsa - languages by lines of code">
  <title>Ali Parsa - languages by lines of code</title>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#131a2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .in { animation: in .6s ease-out both; }
    .grow { transform-origin: 28px 0; animation: grow 1.1s cubic-bezier(.2,.8,.2,1) .2s both; }
    @keyframes in { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  </style>
  <rect x="0.5" y="0.5" width="599" height="269" rx="14" fill="url(#card)" stroke="#30363d"/>
  <rect x="28" y="30" width="4" height="20" rx="2" fill="url(#accent)"/>
  <text x="42" y="46" font-size="18" font-weight="700" fill="#e6edf3">Languages</text>
  <clipPath id="bar"><rect x="28" y="72" width="544" height="12" rx="6"/></clipPath>
  <rect x="28" y="72" width="544" height="12" rx="6" fill="#21262d"/>
  <g clip-path="url(#bar)"><g class="grow"><rect x="28.0" y="72" width="216.5" height="12" fill="#3b82f6"/><rect x="244.0" y="72" width="189.3" height="12" fill="#8b5cf6"/><rect x="432.7" y="72" width="57.1" height="12" fill="#f97316"/><rect x="489.3" y="72" width="42.4" height="12" fill="#facc15"/><rect x="531.2" y="72" width="21.7" height="12" fill="#06b6d4"/><rect x="552.4" y="72" width="16.8" height="12" fill="#10b981"/><rect x="568.7" y="72" width="3.8" height="12" fill="#64748b"/></g></g>
  <g class="in" style="animation-delay:0.30s">
