<svg xmlns="http://www.w3.org/2000/svg" width="600" height="270" viewBox="0 0 600 270" role="img" aria-label="Ali Parsa - GitHub at a glance">
  <title>Ali Parsa - GitHub at a glance</title>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#131a2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .in { animation: in .6s ease-out both; }
    .grow { transform-origin: 28px 0; animation: grow 1.1s cubic-bezier(.2,.8,.2,1) .2s both; }
    @keyframes in { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  </style>
  <rect x="0.5" y="0.5" width="599" height="269" rx="14" fill="url(#card)" stroke="#30363d"/>
  <rect x="28" y="30" width="4" height="20" rx="2" fill="url(#accent)"/>
  <text x="42" y="46" font-size="18" font-weight="700" fill="#e6edf3">At a glance</text>
  <g class="in" style="animation-delay:0.10s">
    <rect x="28" y="72" width="172" height="80" rx="10" fill="#161b22" stroke="#21262d"/>
    <text x="44" y="112" font-size="30" font-weight="800" fill="url(#accent)">6+</text>
    <text x="44" y="135" font-size="13" fill="#8b949e">Years of experience</text>
  </g>
  <g class="in" style="animation-delay:0.22s">
    <rect x="214" y="72" width="172" height="80" rx="10" fill="#161b22" stroke="#21262d"/>
    <text x="230" y="112" font-size="30" font-weight="800" fill="url(#accent)">3.2k+</text>
    <text x="230" y="135" font-size="13" fill="#8b949e">Commits</text>
  </g>
  <g class="in" style="animation-delay:0.34s">
    <rect x="400" y="72" width="172" height="80" rx="10" fill="#161b22" stroke="#21262d"/>
    <text x="416" y="112" font-size="30" font-weight="800" fill="url(#accent)">75+</text>
    <text x="416" y="135" font-size="13" fill="#8b949e">Repositories</text>
  </g>
  <g class="in" style="animation-delay:0.46s">
    <rect x="28" y="166" width="172" height="80" rx="10" fill="#161b22" stroke="#21262d"/>
    <text x="44" y="206" font-size="30" font-weight="800" fill="url(#accent)">840k+</text>
    <text x="44" y="229" font-size="13" fill="#8b949e">Lines of code</text>
  </g>
  <g class="in" style="animation-delay:0.58s">
    <rect x="214" y="166" width="172" height="80" rx="10" fill="#161b22" stroke="#21262d"/>
    <text x="230" y="206" font-size="30" font-weight="800" fill="url(#accent)">9</text>
    <text x="230" y="229" font-size="13" fill="#8b949e">Clinic brands served</text>
  </g>
  <g class="in" style="animation-delay:0.70s">
    <rect x="400" y="166" width="172" height="80" rx="10" fill="#161b22" stroke="#21262d"/>
    <text x="416" y="206" font-size="30" font-weight="800" fill="url(#accent)">8</text>
    <text x="416" y="229" font-size="13" fill="#8b949e">Languages used</text>
  </g>
</svg>
